<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <style>
      @keyframes fade { from{opacity:0;} to{opacity:1;} }
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      @keyframes pulse { 0%,100%{opacity:.4;} 50%{opacity:1;} }
      .t { opacity:0; animation: fade .6s ease-out forwards; }
      .cur { animation: blink 1s step-end infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="1000" height="200" fill="url(#fBg)" rx="12"/>
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#1c1d21"/>

  <circle cx="60" cy="60" r="4.5" fill="#0ea5ff" class="dot"/>
  <text x="78" y="65" font-family="Consolas, monospace" font-size="13" fill="#6b7280">FUTURE PROTOCOL — OPEN TO COLLABORATION</text>

  <text x="60" y="115" class="t" style="animation-delay:.2s" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Let's build something that didn't exist yesterday.</text>

  <text x="60" y="155" class="t" style="animation-delay:.6s" font-family="Consolas, monospace" font-size="14" fill="#0ea5ff">$ ./contact --initiate<tspan class="cur">▍</tspan></text>

  <text x="940" y="185" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#3f434d">© princeprajapati7561-cell — SESSION LOGGED</text>
</svg>
