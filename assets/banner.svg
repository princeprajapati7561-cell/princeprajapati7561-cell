<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0ea5ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ea5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141518" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      @keyframes scan { 0% { transform: translateY(-340px); } 100% { transform: translateY(340px); } }
      @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes flicker { 0%,17%,19%,21%,80%,100% { opacity: 1; } 18%,20% { opacity: 0.55; } }
      @keyframes dash { to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .scanline { animation: scan 5s linear infinite; }
      .dot { animation: pulse 2.2s ease-in-out infinite; }
      .title { animation: flicker 7s ease-in-out infinite; }
      .rule { stroke-dasharray: 640; stroke-dashoffset: 640; animation: dash 2.6s ease-out forwards; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="52" fill="#0ea5ff" opacity="0.04" class="scanline"/>

  <g stroke="#0ea5ff" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M24,24 L24,58 M24,24 L58,24"/>
    <path d="M1176,24 L1176,58 M1176,24 L1142,24"/>
    <path d="M24,316 L24,282 M24,316 L58,316"/>
    <path d="M1176,316 L1176,282 M1176,316 L1142,316"/>
  </g>

  <circle cx="48" cy="48" r="3.5" fill="#0ea5ff" class="dot"/>
  <text x="64" y="52" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6b7280">princeprajapati7561-cell :: booting identity module</text>

  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="62" fill="#ffffff" class="title" letter-spacing="3">PRINCE PRAJAPATI</text>
  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="62" fill="none" stroke="#0ea5ff" stroke-opacity="0.35" letter-spacing="3" filter="url(#blur)">PRINCE PRAJAPATI</text>

  <text x="600" y="200" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" fill="#9ca3af" letter-spacing="2">AI ENGINEER  ·  PYTHON &amp; FLUTTER SYSTEMS ARCHITECT</text>

  <line x1="300" y1="235" x2="900" y2="235" stroke="#0ea5ff" stroke-width="1.5" class="rule"/>

  <text x="600" y="272" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#0ea5ff">&gt; building world-class AI products<tspan class="cursor">▍</tspan></text>

  <text x="600" y="308" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11" fill="#3f434d" letter-spacing="3">STATUS: ONLINE   //   CORE: STABLE   //   REGION: EARTH</text>
</svg>
