<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes spin { from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
      @keyframes barGrow { 0%{width:0;} 60%{width:640px;} 100%{width:640px;} }
      @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
      .spinner { transform-origin: 45px 45px; animation: spin 1.2s linear infinite; }
      .bar { animation: barGrow 2.4s ease-out forwards; }
      .cursor { animation: blink 1s step-end infinite; }
    </style>
    <linearGradient id="loadGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="90" rx="10" fill="#000000" stroke="#1c1d21"/>
  <circle cx="45" cy="45" r="16" fill="none" stroke="#1c1d21" stroke-width="3"/>
  <path class="spinner" d="M45,29 A16,16 0 0,1 61,45" fill="none" stroke="#0ea5ff" stroke-width="3" stroke-linecap="round"/>

  <text x="82" y="38" font-family="Consolas, monospace" font-size="13" fill="#9ca3af">OPERATING SYSTEM STATUS</text>
  <text x="82" y="58" font-family="Consolas, monospace" font-size="13" fill="#ffffff">loading reality engine<tspan class="cursor" fill="#0ea5ff">▍</tspan></text>

  <rect x="82" y="70" width="640" height="6" rx="3" fill="#151619"/>
  <rect x="82" y="70" height="6" rx="3" fill="url(#loadGrad)" class="bar"/>

  <text x="960" y="50" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#0ea5ff">99.9% UPTIME</text>
</svg>
